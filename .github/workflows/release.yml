name: Release

# A Release Manager pushes a v*.*.* tag. `verify` proves the tag is releasable, `audit-rust` and
# `audit-js` refuse a high advisory,
# `build` waits for a Release Manager to approve the `release` environment (that
# approval unlocks the environment's secrets, if any), and `publish` creates a DRAFT release.
# Publishing the draft stays a human click. See CONTRIBUTING.md ("Releasing Oxide") for the runbook.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: The tag is on main or a release branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for branch in $(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "$TAG (${GITHUB_SHA}) is on ${branch#refs/remotes/}."
              exit 0
            fi
          done
          echo "::error::$TAG points at ${GITHUB_SHA}, which is not on main or a release/* branch. Tag a commit that was merged through a pull request."
          exit 1

      - name: The tag matches the declared version
        env:
          TAG: ${{ github.ref_name }}
        run: node tools/ci/cli.mjs release-version "$TAG"

      - name: The gate succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        # The rulesets don't require up-to-date branches, so two green PRs can break
        # together; the push run of CI on the exact commit is the proof.
        run: |
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=completed" --jq '.workflow_runs[].id')
          for run in $runs; do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs" --jq '.jobs[] | select(.name == "gate") | .conclusion')
            if [ "$conclusion" = "success" ]; then
              echo "gate succeeded in CI run ${run} on ${GITHUB_SHA}."
              exit 0
            fi
          done
          echo "::error::No push run of CI has a successful gate on ${GITHUB_SHA}. Wait for CI on the main run to finish (or fix it) before tagging."
          exit 1

  # Gate: nothing is built, and no signing secret unlocked, while a scan reports a
  # high advisory. The same scans run daily in advisories.yml.
  audit-rust:
    name: audit-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  audit-js:
    name: audit-js
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm --dir web audit --prod --audit-level high

  build:
    name: build (${{ matrix.platform }})
    needs: [verify, audit-rust, audit-js]
    strategy:
      fail-fast: true
      matrix:
        platform: [macos-aarch64, windows-x64, windows-aarch64, linux-x64, linux-aarch64]
    # Needs the `release` environment's secrets; build.yml declares the environment,
    # so a Release Manager must approve before the signing keys are readable. The build jobs read only the
    # update key (in the Tauri build steps); they test that the repository key exists without reading it.
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      release: true
    secrets: inherit

  # Signs the packages and builds both Linux repositories with the repository key (ADR-0021). Only this
  # job reads the key, and it runs before the draft exists, so the checksums and attestations cover the
  # signed .rpm files and publishing needs no second approval. It names the `release` environment, so a
  # Release Manager approves it, as for the builds.
  repositories:
    name: repositories
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check the repository signing secrets
        env:
          OXIDE_REPOSITORY_SIGNING_KEY: ${{ secrets.OXIDE_REPOSITORY_SIGNING_KEY }}
          OXIDE_REPOSITORY_SIGNING_KEY_PASSPHRASE: ${{ secrets.OXIDE_REPOSITORY_SIGNING_KEY_PASSPHRASE }}
        run: node tools/ci/cli.mjs require-secrets OXIDE_REPOSITORY_SIGNING_KEY OXIDE_REPOSITORY_SIGNING_KEY_PASSPHRASE

      - name: Download the Linux builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oxide-linux-*-release
          merge-multiple: true
          path: linux

      - name: Install the signing tools
        run: sudo apt-get install -y --no-install-recommends rpm dpkg-dev createrepo-c

      - name: Sign the packages and build the repositories
        env:
          OXIDE_REPOSITORY_SIGNING_KEY: ${{ secrets.OXIDE_REPOSITORY_SIGNING_KEY }}
          OXIDE_REPOSITORY_SIGNING_KEY_PASSPHRASE: ${{ secrets.OXIDE_REPOSITORY_SIGNING_KEY_PASSPHRASE }}
        run: tools/ci/sign-repositories.sh "$TAG" linux repository

      # The signed .rpm files and the APT flat repository become release assets.
      - name: Upload the signed repository assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-release
          path: repository/assets/*
          if-no-files-found: error
          retention-days: 7

      # Only the DNF metadata lives on the update site; verify-release.yml writes it for a stable release.
      - name: Upload the DNF metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dnf-site
          path: repository/dnf/rpm
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish
    needs: [build, repositories]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The job holds no signing secrets, only the token that writes the draft.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oxide-*-release
          merge-multiple: true
          path: staged

      - name: Download the signed repository files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository-release
          path: staged-repository

      - name: Assemble the deliverables
        run: |
          mkdir release metadata
          find staged -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} release/ \;
          # The signed .rpm files overwrite the unsigned ones the build made; the APT index and the key come with them.
          cp staged-repository/* release/
          # latest.json names this release's signed updater packages (ADR-0021). It fails the run when a
          # signature is missing or empty, before anything is checksummed, attested or drafted.
          node tools/ci/cli.mjs updater-feed "$TAG" release > release/latest.json
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq .sbom > "metadata/Oxide_${TAG#v}.spdx.json"
          (cd release && sha256sum -- * > ../metadata/SHA256SUMS.txt)
          ls -l release metadata

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: metadata/*
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Draft the notes
        run: |
          node tools/ci/cli.mjs release-notes "$TAG" > notes.md
          {
            echo
            node tools/ci/cli.mjs downloads release
            echo
            echo "### Platform signing"
            echo
            for notice in staged/NOTICE-*.txt; do echo "- $(cat "$notice")"; done
            echo
            echo "### Checksums (SHA-256)"
            echo
            echo '```text'
            node tools/ci/cli.mjs release-checksums metadata/SHA256SUMS.txt
            echo '```'
            echo
            echo "Verify any download with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
          } >> notes.md

      - name: Create the draft release
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" release/* --draft --verify-tag --title "Oxide ${TAG#v}" --notes-file notes.md "${flags[@]}"
