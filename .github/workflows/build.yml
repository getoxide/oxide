name: Build

# The one place Oxide's installers are built. CI calls it with `release: false`
# (unsigned, caches allowed) to prove packaging works; Release calls it with
# `release: true` (no caches) on a tag.
#
# The `release` environment is declared here, not by the callers: a job that
# calls a reusable workflow cannot name an environment, and the environment's
# required reviewers and secrets must guard the job that reads them.
on:
  workflow_call:
    inputs:
      platform:
        description: macos-aarch64, windows-x64, windows-aarch64, linux-x64 or linux-aarch64
        type: string
        required: true
      release:
        description: Build for publication (no caches)
        type: boolean
        default: false
    outputs:
      artifact:
        description: Name of the uploaded artifact
        value: ${{ jobs.build.outputs.artifact }}
      signed:
        description: Whether the macOS app carries a Developer ID signature
        value: ${{ jobs.build.outputs.signed }}
      notarized:
        description: Whether the macOS app was notarized
        value: ${{ jobs.build.outputs.notarized }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: build (${{ inputs.platform }})
    # Linux builds on the oldest supported runner: an AppImage or .deb links the glibc it
    # was built against, so building on 22.04 keeps it running on older distributions.
    runs-on: ${{ fromJSON('{"macos-aarch64":"macos-15","windows-x64":"windows-2025","windows-aarch64":"windows-11-arm","linux-x64":"ubuntu-22.04","linux-aarch64":"ubuntu-22.04-arm"}')[inputs.platform] }}
    timeout-minutes: 75
    environment: ${{ inputs.release && 'release' || '' }}
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
      signed: ${{ steps.apple.outputs.signed }}
      notarized: ${{ steps.apple.outputs.notarized }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the inputs
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            macos-aarch64|windows-x64|windows-aarch64|linux-x64|linux-aarch64) ;;
            *) echo "::error::Unknown platform '$PLATFORM': use macos-aarch64, windows-x64, windows-aarch64, linux-x64 or linux-aarch64."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # A release is useless without updater signatures or the repository key: stop before the first build minute is spent.
      - name: Check the signing secrets
        if: inputs.release
        env:
          # Presence only: a key's value never enters this job's environment through this step.
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          HAS_OXIDE_REPOSITORY_SIGNING_KEY: ${{ secrets.OXIDE_REPOSITORY_SIGNING_KEY != '' }}
          HAS_OXIDE_REPOSITORY_SIGNING_KEY_PASSPHRASE: ${{ secrets.OXIDE_REPOSITORY_SIGNING_KEY_PASSPHRASE != '' }}
        run: node tools/ci/cli.mjs require-secrets --present TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD OXIDE_REPOSITORY_SIGNING_KEY OXIDE_REPOSITORY_SIGNING_KEY_PASSPHRASE

      - uses: ./.github/actions/setup-rust
        with:
          # A release is a clean build: it neither reads nor writes a cache.
          save-cache: "false"
          use-cache: ${{ !inputs.release }}

      - run: pnpm --dir web install --frozen-lockfile

      - name: Apple signing and notarization
        id: apple
        if: inputs.platform == 'macos-aarch64'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        # Tauri treats a set-but-empty APPLE_CERTIFICATE as a certificate to import,
        # so nothing is exported unless the secret has a value.
        run: |
          signed=false
          notarized=false
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            signed=true
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
              notarized=true
              key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
              umask 077
              printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
              {
                echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
                echo "APPLE_API_KEY=$APPLE_API_KEY"
                echo "APPLE_API_KEY_PATH=$key_path"
              } >> "$GITHUB_ENV"
            fi
          else
            # Apple Silicon refuses to launch a downloaded app that has no signature at all.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"

      # A release also builds the updater packages and signs them (ADR-0021). The signing key is
      # read by the build steps only. CI builds stay unsigned: without a key, Tauri refuses to
      # build updater packages, so only a release merges the config that asks for them.
      - name: Choose the Tauri config
        id: config
        env:
          RELEASE: ${{ inputs.release }}
        run: echo "updater=$([ "$RELEASE" = "true" ] && echo "crates/oxide-app/tauri.updater.conf.json")" >> "$GITHUB_OUTPUT"

      - name: Build the macOS bundles
        if: inputs.platform == 'macos-aarch64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_CONFIG: ${{ steps.config.outputs.updater }}
          # Tauri skips the Finder step that lays out the disk image window (background, icon size and
          # positions from bundle.macOS.dmg) when CI=true; the macOS runner can run it, so ask for it.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: web/node_modules/.bin/tauri build --ci --bundles app,dmg ${UPDATER_CONFIG:+--config "$UPDATER_CONFIG"} -- --locked

      - name: Build the Windows installer
        if: startsWith(inputs.platform, 'windows-')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_CONFIG: ${{ steps.config.outputs.updater }}
        run: web/node_modules/.bin/tauri.cmd build --ci --bundles nsis ${UPDATER_CONFIG:+--config "$UPDATER_CONFIG"} -- --locked

      - name: Build the Linux bundles
        if: startsWith(inputs.platform, 'linux-')
        env:
          # The runner has no FUSE for linuxdeploy, and its bundled `strip` can't read newer ELF sections.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_CONFIG: ${{ steps.config.outputs.updater }}
        run: web/node_modules/.bin/tauri build --ci --bundles appimage,deb,rpm ${UPDATER_CONFIG:+--config "$UPDATER_CONFIG"} -- --locked

      - name: Name the artifact
        id: name
        env:
          PLATFORM: ${{ inputs.platform }}
          RELEASE: ${{ inputs.release }}
        run: echo "artifact=oxide-${PLATFORM}$([ "$RELEASE" = "true" ] && echo -release || echo -ci)" >> "$GITHUB_OUTPUT"

      - name: Stage the release deliverables
        if: inputs.release
        env:
          PLATFORM: ${{ inputs.platform }}
          SIGNED: ${{ steps.apple.outputs.signed }}
          NOTARIZED: ${{ steps.apple.outputs.notarized }}
        # Each deliverable gets the short name users see, with no version (INSTALLERS in tools/ci/policy.mjs):
        # Oxide.dmg, Oxide-<arch>.exe, Oxide-<arch>.AppImage/.deb/.rpm, so releases/latest/download/<name> works.
        run: |
          version=$(node -p "require('./crates/oxide-app/tauri.conf.json').version")
          bundle=target/release/bundle
          mkdir -p staged
          # stage <source> <name>: copy one installer under its release name.
          stage() {
            cp "$1" "staged/$2"
          }
          # stage_signed <installer> <name>: the same, plus the updater signature next to it.
          stage_signed() {
            stage "$1" "$2"
            cp "$1.sig" "staged/$2.sig"
          }
          case "$PLATFORM" in
            macos-aarch64)
              stage "$bundle/dmg/Oxide_${version}_aarch64.dmg" Oxide.dmg
              # The updater package is the .app archive; its name keeps both extensions.
              stage_signed "$bundle/macos/Oxide.app.tar.gz" Oxide.app.tar.gz
              if [ "$NOTARIZED" = "true" ]; then
                notice="The macOS build is signed with a Developer ID certificate and notarized by Apple."
              elif [ "$SIGNED" = "true" ]; then
                notice="The macOS build is signed with a Developer ID certificate but not notarized; Gatekeeper may ask for confirmation on first launch."
              else
                notice="The macOS build is ad-hoc signed, not notarized: after downloading, open it with right-click → Open (or run \`xattr -dr com.apple.quarantine Oxide.app\`). Once installed in Applications, Oxide updates itself: the Update button downloads, verifies and installs a release, then asks to restart."
              fi
              ;;
            windows-x64|windows-aarch64)
              # Tauri names the installer after the architecture: x64-setup.exe or arm64-setup.exe.
              arch=x64; if [ "$PLATFORM" = "windows-aarch64" ]; then arch=arm64; fi
              stage_signed "$bundle/nsis/Oxide_${version}_${arch}-setup.exe" "Oxide-${arch}.exe"
              notice="The Windows installer is not Authenticode-signed: SmartScreen may warn on first run (More info → Run anyway). Verify the download against the release checksums or attestation. Once installed, Oxide updates itself: the Update button downloads, verifies and installs a release, then runs the installer without wizard pages on Restart now, or when you quit."
              ;;
            linux-x64|linux-aarch64)
              arch=x64; if [ "$PLATFORM" = "linux-aarch64" ]; then arch=arm64; fi
              # Exactly one AppImage, one .deb and one .rpm per architecture.
              for pattern in "appimage/*.AppImage" "deb/*.deb" "rpm/*.rpm"; do
                mapfile -t matches < <(compgen -G "$bundle/$pattern" || true)
                if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
                  echo "::error::Expected exactly one $pattern in $bundle, found: ${matches[*]}"
                  exit 1
                fi
                # The AppImage is also the updater package: its signature goes next to it.
                case "${matches[0]}" in
                  *.AppImage) stage_signed "${matches[0]}" "Oxide-${arch}.AppImage" ;;
                  *) stage "${matches[0]}" "Oxide-${arch}.${matches[0]##*.}" ;;
                esac
              done
              notice="The Linux .deb and .rpm packages and the APT and DNF repositories are signed with the Oxide repository key: add the repository once (see the README), then \`sudo apt install oxide\` or \`sudo dnf install oxide\` installs and updates Oxide. The AppImage updates itself from the Update button (the file you launched is replaced). Verify any download against the release checksums or attestation."
              ;;
          esac
          printf '%s\n' "$notice" > "staged/NOTICE-${PLATFORM}.txt"
          ls -l staged

      - name: Upload the release deliverables
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: staged/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload the CI bundles
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            target/release/bundle/macos/Oxide.app
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
