name: Verify release

# Runs when a Release Manager publishes the draft: check what users will actually
# download (checksums and attestations), deploy the update site (Cloudflare Workers Static Assets)
# from the latest stable release's DNF archive plus redirects, and check both update feeds and
# Linux repositories on updates.getoxide.dev (ADR-0021). A failure opens a needs-triage issue.
# This workflow holds no signing key.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: verify published release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # First, before anything is downloaded or written: the pre-release flag and the tag must agree.
      # Releases v0.0.2 to v0.0.4 were flagged by hand without a suffix; a stable release flagged as a
      # pre-release is skipped by GitHub's "latest", so no feed or repository would ever serve it.
      - name: Check that the pre-release flag agrees with the tag
        run: node tools/ci/cli.mjs check-prerelease "$TAG" "$PRERELEASE"

      - name: Download the assets, metadata and check the checksums
        run: |
          mkdir verify-assets verify-metadata
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-assets
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$TAG" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Could not find a completed Release workflow run for $TAG."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name release-metadata --dir verify-metadata
          (cd verify-assets && sha256sum --check ../verify-metadata/SHA256SUMS.txt)

      - name: Verify the attestations
        working-directory: verify-assets
        run: |
          while read -r _ file; do
            file="${file#\*}"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done < ../verify-metadata/SHA256SUMS.txt

      - name: Open an issue
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --label needs-triage \
            --title "Release $TAG failed post-publish verification" \
            --body "Verification of the published release **$TAG** failed: the pre-release flag, checksums or attestations. See $RUN_URL. Roll forward with a patch release if the assets are bad (published releases are immutable)."

  # Deploys the update site to Cloudflare Workers Static Assets (oxide-updates at updates.getoxide.dev)
  # with no git branch: _redirects routes the stable feed and APT paths to the latest GitHub release
  # assets, and /rpm/ serves the DNF metadata rebuilt from the latest published stable release.
  deploy-site:
    name: deploy update site
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      issues: write
    concurrency:
      group: update-site
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Assemble the update site from the latest stable release
        run: |
          mkdir -p site dnf-archive
          cat > site/_redirects << 'EOF'
          /latest.json https://github.com/getoxide/oxide/releases/latest/download/latest.json 302
          /apt/* https://github.com/getoxide/oxide/releases/latest/download/:splat 302
          EOF
          stable_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select((.isDraft | not) and (.isPrerelease | not))][0].tagName')
          if [ -n "$stable_tag" ] && [ "$stable_tag" != "null" ]; then
            echo "Building DNF repository from latest stable release: $stable_tag"
            gh release download "$stable_tag" --repo "$GITHUB_REPOSITORY" --pattern dnf-site.tar.gz --dir dnf-archive
            tar -xzf dnf-archive/dnf-site.tar.gz -C site
          else
            echo "No published stable release yet; deploying redirects only."
          fi

      - name: Deploy to Cloudflare Workers Static Assets
        run: npx --yes wrangler@4.168.0 deploy --name oxide-updates --assets site --compatibility-date 2026-11-26

      - name: Open an issue
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --label needs-triage \
            --title "Release $TAG failed to deploy the update site" \
            --body "Deploying the update site for **$TAG** to Cloudflare failed (the previous deployment remains online). See $RUN_URL."

  # Checks that the stable feed on updates.getoxide.dev and the GitHub releases API pre-release feed
  # both resolve to the expected release and every package URL resolves.
  update-feeds:
    name: update feeds
    needs: deploy-site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      STABLE_FEED: https://updates.getoxide.dev/latest.json
      PRERELEASE_API: https://api.github.com/repos/getoxide/oxide/releases?per_page=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check that both feeds name the release and every URL resolves
        run: |
          mkdir feeds
          ok=false
          for attempt in $(seq 1 12); do
            curl -fsSL "$STABLE_FEED" -o feeds/stable.json || echo '{}' > feeds/stable.json
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$PRERELEASE_API" -o feeds/releases.json || echo '[]' > feeds/releases.json
            prerelease_url=$(node tools/ci/cli.mjs prerelease-feed-url feeds/releases.json)
            if [ -n "$prerelease_url" ]; then
              curl -fsSL "$prerelease_url" -o feeds/prerelease.json || echo '{}' > feeds/prerelease.json
            else
              echo '{}' > feeds/prerelease.json
            fi
            if node tools/ci/cli.mjs check-feeds "$TAG" feeds/stable.json feeds/prerelease.json; then ok=true; break; fi
            echo "Attempt $attempt: not yet. Waiting."
            sleep 15
          done
          if [ "$ok" != "true" ]; then
            node tools/ci/cli.mjs check-feeds "$TAG" feeds/stable.json feeds/prerelease.json
            exit 1
          fi
          urls=$(node tools/ci/cli.mjs feed-urls feeds/prerelease.json)
          case "$TAG" in *-*) ;; *) urls="$urls"$'\n'"$(node tools/ci/cli.mjs feed-urls feeds/stable.json)" ;; esac
          for url in $(printf '%s\n' "$urls" | sort -u); do
            curl -fsSL -r 0-0 -o /dev/null "$url" || { echo "::error::$url does not resolve."; exit 1; }
            echo "$url resolves."
          done

      - name: Open an issue
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --label needs-triage \
            --title "Release $TAG failed the update feed check" \
            --body "The update feeds do not both name the published release **$TAG**, or a package URL does not resolve. See $RUN_URL. Installs would not be offered the update."

  # The Linux repositories (ADR-0021). Both APT and DNF are checked through updates.getoxide.dev
  # the way a user's system fetches them, verifying signatures and package hashes.
  linux-repositories:
    name: linux repositories
    needs: update-feeds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      APT_SITE: https://updates.getoxide.dev/apt/
      DNF_SITE: https://updates.getoxide.dev/rpm/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the verification tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm gpgv gnupg

      - name: Download the release's assets and decide what the repositories take
        id: plan
        run: |
          # Not "assets": the checkout already has the repository's assets/ directory (the icon masters).
          mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          node tools/ci/cli.mjs repository-plan "$TAG" release-assets | tee plan.json

      - name: Check the APT repository
        env:
          STABLE: ${{ steps.plan.outputs.stable }}
        run: |
          # Stable releases are served through updates.getoxide.dev/apt/; a pre-release is only reachable by its tag.
          if [ "$STABLE" = "true" ]; then base="$APT_SITE"; else base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/"; fi
          mkdir apt
          for file in InRelease Release Packages oxide-repository.gpg; do
            ok=false
            for attempt in $(seq 1 12); do
              if curl -fsSL "${base}${file}" -o "apt/$file" && { [ "$STABLE" != "true" ] || cmp -s "apt/$file" "release-assets/$file"; }; then ok=true; break; fi
              echo "Attempt $attempt: $file is not the release's yet."
              sleep 10
            done
            if [ "$ok" != "true" ]; then echo "::error::$base$file is not this release's file."; exit 1; fi
          done
          for deb in $(node -p 'JSON.parse(require("fs").readFileSync("plan.json", "utf8")).debs.map((p) => p.name).join(" ")'); do
            curl -fsSL "${base}${deb}" -o "apt/$deb"
          done
          # What apt does: the signed InRelease must verify against the published key and carry the Release file.
          gpgv --keyring "$PWD/apt/oxide-repository.gpg" --output apt/Release.verified apt/InRelease
          cmp apt/Release.verified apt/Release
          # The check reads the release's whole file list: it needs the .rpm names beside the .deb files.
          cp release-assets/*.rpm apt/
          node tools/ci/cli.mjs check-apt "$TAG" apt

      - name: Check the DNF repository
        if: steps.plan.outputs.publish == 'true'
        run: |
          mkdir dnf
          # The published packages: their hashes are what the metadata must carry.
          cp release-assets/*.rpm release-assets/*.deb dnf/
          fetch() {
            curl -fsSL "${DNF_SITE}repodata/repomd.xml" -o dnf/repomd.xml &&
              curl -fsSL "${DNF_SITE}repodata/repomd.xml.asc" -o dnf/repomd.xml.asc &&
              curl -fsSL "${DNF_SITE}oxide-repository.asc" -o dnf/oxide-repository.asc &&
              primary=$(grep -o 'repodata/[^"]*primary.xml.gz' dnf/repomd.xml | head -1) &&
              curl -fsSL "${DNF_SITE}${primary}" -o "dnf/$(basename "$primary")" &&
              node tools/ci/cli.mjs check-dnf "$TAG" dnf
          }
          ok=false
          for attempt in $(seq 1 12); do
            if fetch; then ok=true; break; fi
            echo "Attempt $attempt: the site does not serve this release's metadata yet. Waiting."
            sleep 15
          done
          if [ "$ok" != "true" ]; then fetch; exit 1; fi
          # The signatures: the site's key is the release's key, repomd.xml and every .rpm carry it.
          cmp dnf/oxide-repository.asc release-assets/oxide-repository.asc
          export GNUPGHOME="$RUNNER_TEMP/gnupg-dnf"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import dnf/oxide-repository.asc
          gpg --batch --verify dnf/repomd.xml.asc dnf/repomd.xml
          rpmkeys --dbpath "$RUNNER_TEMP/rpmdb" --import dnf/oxide-repository.asc
          for rpm in dnf/*.rpm; do
            rpmkeys --dbpath "$RUNNER_TEMP/rpmdb" --checksig "$rpm" | tee /dev/stderr | grep -q "signatures OK"
          done

      - name: Open an issue
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --label needs-triage \
            --title "Release $TAG failed the Linux repository check" \
            --body "The APT or DNF repository of the published release **$TAG** failed its signature or package hash check. See $RUN_URL. Linux package installs may not receive the update."
