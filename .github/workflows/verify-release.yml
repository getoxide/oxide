name: Verify release

# Runs when a Release Manager publishes the draft. The updater feed is the one
# thing that, once broken, affects every installed app, so check what users will
# actually download. A failure opens a needs-triage issue.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: verify published release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      issues: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download the assets, metadata and check the checksums
        run: |
          mkdir verify-assets verify-metadata
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-assets
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$TAG" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Could not find a completed Release workflow run for $TAG."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name release-metadata --dir verify-metadata
          (cd verify-assets && sha256sum --check ../verify-metadata/SHA256SUMS.txt)

      - name: Verify the attestations
        working-directory: verify-assets
        run: |
          while read -r _ file; do
            file="${file#\*}"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done < ../verify-metadata/SHA256SUMS.txt

      - name: Publish and verify the update feed
        if: env.PRERELEASE != 'true'
        run: |
          node tools/ci/cli.mjs update-feed verify-metadata/latest.json "$TAG" > feed.log
          grep '^https://' feed.log | while read -r url; do
            curl -fsSL -r 0-0 -o /dev/null "$url" || { echo "::error::The update feed points at $url, which does not resolve."; exit 1; }
          done

          blob_sha=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$(base64 -w0 < verify-metadata/latest.json)" -f encoding=base64 --jq .sha)
          tree_sha=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/trees" -f "tree[0][path]=latest.json" -f "tree[0][mode]=100644" -f "tree[0][type]=blob" -f "tree[0][sha]=${blob_sha}" --jq .sha)
          parent_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/updater" --jq .object.sha 2>/dev/null || true)
          if [ -n "$parent_sha" ]; then
            commit_sha=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/commits" -f message="chore(updater): ${TAG}" -f tree="${tree_sha}" -f "parents[0]=${parent_sha}" --jq .sha)
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/updater" -f sha="${commit_sha}" -F force=false > /dev/null
          else
            commit_sha=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/commits" -f message="chore(updater): ${TAG}" -f tree="${tree_sha}" --jq .sha)
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/updater" -f sha="${commit_sha}" > /dev/null
          fi

          gh api -H "Accept: application/vnd.github.raw+json" "repos/${GITHUB_REPOSITORY}/contents/latest.json?ref=updater" > published-feed.json
          node tools/ci/cli.mjs update-feed published-feed.json "$TAG"
          for attempt in 1 2 3 4; do
            if curl -fsSL -o /dev/null "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/updater/latest.json?t=$(date +%s)"; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/updater/latest.json did not resolve."
              exit 1
            fi
            sleep 5
          done

      - name: Open an issue
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --label needs-triage \
            --title "Release $TAG failed post-publish verification" \
            --body "Verification of the published release **$TAG** failed: checksums, attestations or the update feed. Installed apps may be affected. See $RUN_URL. Roll forward with a patch release if the assets are bad (published releases are immutable)."
