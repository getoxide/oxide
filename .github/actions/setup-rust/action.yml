name: Set up Rust
description: Pinned toolchain, Rust cache and native build requirements. The single place to change them.

inputs:
  save-cache:
    description: Whether this run may save the Rust cache ("true" or "false").
    default: "false"

  use-cache:
    description: Whether to restore the Rust cache at all ("true" or "false"). Release builds are clean.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      # rust-toolchain.toml names the channel and components.
      run: rustup toolchain install --no-self-update

    - name: Restore the Rust cache
      if: inputs.use-cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ inputs.save-cache }}

    - name: Install the Linux native libraries
      if: runner.os == 'Linux'
      shell: bash
      # What Tauri's WebKitGTK webview and the AppImage, .deb and .rpm bundlers need.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential curl file patchelf pkg-config xdg-utils \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev

    - name: Make libclang available (Windows)
      if: runner.os == 'Windows' && runner.arch == 'X64'
      shell: bash
      # Bindgen needs libclang; the image ships LLVM.
      run: |
        if [ ! -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then
          echo "::error::libclang.dll not found in C:/Program Files/LLVM/bin on this runner image."
          exit 1
        fi
        echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"

    - name: Assert CMake and Python are present
      shell: bash
      # The runner images ship both; native builds need them.
      run: |
        cmake --version
        if command -v python3 >/dev/null 2>&1; then python3 --version; else python --version; fi
