[package]
name = "oxide-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dunce = "1"
base64 = { workspace = true }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
sha2 = "0.11"
tar = "0.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
crossbeam-channel = { workspace = true }
ignore = "0.4.33"
notify = "8"
oxide-provider = { path = "../oxide-provider" }
portable-pty = "0.9.0"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[lints]
workspace = true
