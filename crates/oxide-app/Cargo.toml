[package]
name = "oxide-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "oxide_app_lib"

[dependencies]
oxide-core = { path = "../oxide-core" }
oxide-platform = { path = "../oxide-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }


[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
