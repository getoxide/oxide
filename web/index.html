<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>Oxide</title>
    <link rel="stylesheet" href="/src/startup.css" />
    <script>
      if (typeof navigator !== "undefined" && /Mac|iP(hone|od|ad)/i.test(navigator.userAgent || navigator.platform)) {
        document.documentElement.classList.add("macos");
      }
      {
        const syncStartupVisibility = () => { document.documentElement.dataset.windowHidden = String(document.hidden); };
        document.addEventListener("visibilitychange", syncStartupVisibility);
        syncStartupVisibility();
      }
    </script>
    <style>
      :root { color-scheme: dark; background: #1C1C1E; }
      html, body, #root { height: 100%; margin: 0; background: #1C1C1E; }
      body { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" class="startup-screen" role="status" aria-live="polite" aria-busy="true">
      <div class="startup-content">
        <div class="startup-emblem" aria-hidden="true">
          <span class="startup-orbit"><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="40" pathLength="360" /></svg></span>
          <svg width="48" height="48" viewBox="232 232 560 560" aria-hidden="true">
            <defs><linearGradient id="boot-mark-ink" gradientUnits="userSpaceOnUse" x1="512" y1="260" x2="512" y2="764"><stop offset="0" stop-color="#E8E6E1"/><stop offset="1" stop-color="#9A9892"/></linearGradient></defs>
            <g fill="none" stroke-linecap="round"><g stroke="url(#boot-mark-ink)" stroke-width="62"><path d="M424 291H384A62 62 0 0 0 322 353V450A62 62 0 0 1 260 512A62 62 0 0 1 322 574V671A62 62 0 0 0 384 733H424"/><path d="M600 291H640A62 62 0 0 1 702 353V450A62 62 0 0 0 764 512A62 62 0 0 0 702 574V671A62 62 0 0 1 640 733H600"/></g><g stroke="#E8E6E1" stroke-width="48"><path d="M448 472V552"/><path d="M576 472V552"/></g></g>
          </svg>
        </div>
        <div class="startup-copy">
          <span class="startup-wordmark">Oxide</span>
          <p>Preparing your workspace</p>
          <span class="startup-detail">Loading Projects and Threads</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
