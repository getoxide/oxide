<!doctype html>
<!-- PROTOTYPE, throwaway. Question (issue #529): how does a Project row offer its Files (drill-in, variant C of #525) and how does the user get back?
     Variants: A (file icon always on the row), B (file icon with the + and x on hover/focus/selected), C (no icon: a second click on the selected Project), D (a "Files" line under the Project).
     Reuses the real Oxide CSS. In-memory state. Open the file directly; switch with the bottom bar, arrows or ?variant=B -->
<html><head><meta charset="utf-8"><title>PROTOTYPE files-project-row</title>
<link rel="stylesheet" href="../src/styles/fonts.css"><link rel="stylesheet" href="../src/styles/styles.css">
<style>
body{margin:0}
.tree{padding:6px 0;font-size:13px}.tree div{padding:3px 12px;color:var(--dim);white-space:nowrap}.tree .d{color:var(--fg)}
.ph{display:flex;align-items:center;padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
.ph .project{flex:1;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--fg-bright);padding:6px 4px 6px 12px;cursor:pointer;font-weight:600;min-width:0}
.ph .project:hover{color:#fff}
.ph .hint{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:400}
.ra{opacity:0;pointer-events:none}
.project-row:is(:hover,:focus-within) .ra,.project-row.on .ra{opacity:1;pointer-events:auto}
.ra.always{opacity:1;pointer-events:auto}
.row-action.always{opacity:1;pointer-events:auto}
.fbtn{color:var(--faint)}
.centre-mock{flex:1;display:flex;min-width:0}
.half{flex:1;padding:12px;font-family:var(--mono);font-size:12px;color:var(--dim);min-width:0}
.half+.half{border-left:1px solid var(--line);background:var(--bg)}
.bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:99px;padding:6px 10px;display:flex;gap:10px;align-items:center;font:600 13px Inter,sans-serif;box-shadow:0 4px 20px #000a;z-index:99}
.bar button{border:0;background:#ddd;border-radius:99px;width:26px;height:26px;cursor:pointer}
.note{position:fixed;top:48px;right:12px;max-width:320px;background:var(--bg3);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--dim);z-index:4;line-height:1.45}
.note b{color:var(--fg-bright)}
</style></head><body>
<div id="app"></div><div class="bar" id="bar"></div>
<script>
const P=[{n:"oxide",t:["claude","pnpm dev"],f:["crates/","  oxide-core/","  oxide-app/","web/","  src/","    App.tsx","GLOSSARY.md"]},
         {n:"compass-site",t:["shell"],f:["templates/","  _layout.twig","src/","  app.js","composer.json"]},
         {n:"notes",t:[],f:["inbox.md","ideas/","  fileview.md"]}];
const V=[["A","File icon always on the row"],["B","File icon with + and × (hover/selected)"],["C","No icon: second click on selected"],["D","A Files line under the Project"]];
let sel=0,selT=0,drill=null,closed=[];
let vi=Math.max(0,V.findIndex(v=>v[0]==new URLSearchParams(location.search).get("variant")));
const k=()=>V[vi][0];
const S=(d)=>`<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">${d}</svg>`;
const ic={repo:S('<path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/>'),
 chev:'<svg class="disclosure-chev" width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/></svg>',
 back:S('<path d="M7.78 12.53a.75.75 0 0 1-1.06 0L2.47 8.28a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 1.06L4.81 7h7.44a.75.75 0 0 1 0 1.5H4.81l2.97 2.97a.75.75 0 0 1 0 1.06Z"/>'),
 term:S('<path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25Z"/>'),
 file:S('<path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Z"/>'),
 plus:S('<path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/>'),
 x:S('<path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/>')};
const act=(cls,a,i,icon,title)=>`<button class="row-action btn ${cls}" data-a="${a}" data-i="${i}" title="${title}" aria-label="${title}">${icon}</button>`;
function row(p,i){
 const v=k(),on=i==sel,open=!closed.includes(i);
 const name=`<button class="project" aria-current="${on}" aria-expanded="${open}" data-a="name" data-i="${i}">${ic.chev.replace('class="','data-chev="1" class="')}${ic.repo}<span class="project-name">${p.n}</span></button>`;
 const actions=`${v=="A"?act("always fbtn","files",i,ic.file,`Show files of ${p.n}`):""}${v=="B"?act("ra fbtn","files",i,ic.file,`Show files of ${p.n}`):""}${act("ra","term",i,ic.plus,"New terminal")}${act("ra","close",i,ic.x,"Close Project")}`;
 const terms=!open?"":`<ul class="terminal-list">${v=="D"?`<li class="terminal-row"><button class="terminal-item" data-a="files" data-i="${i}">${ic.file}<span class="terminal-item-title">Files</span></button></li>`:""}${p.t.length?p.t.map((t,j)=>`<li class="terminal-row"><button class="terminal-item" aria-current="${i==sel&&j==selT}" data-a="term-sel" data-i="${i}" data-j="${j}">${ic.term}<span class="terminal-item-title">${t}</span></button></li>`).join(""):`<li class="sidebar-note">No terminals</li>`}</ul>`;
 return `<li class="project-node"><div class="project-row ${on?"on":""}">${name}${actions}</div>${terms}</li>`;
}
const tree=()=>`<div class="tree">${P[drill].f.map(l=>`<div class="${l.endsWith("/")?"d":""}" style="padding-left:${12+l.search(/\S/)*8}px">${l.trim()}</div>`).join("")}</div>`;
const notes={
A:"<b>A</b>: the file icon is always on the row, next to the + and × that appear on hover. Visible and discoverable, but one more permanent glyph on every row. A click on the name selects; collapsing is the chevron only.",
B:"<b>B</b>: the file icon joins the + and × (hover/focus, and always on the selected row). Calm at rest, consistent with the existing actions, but hidden on unselected rows until you hover.",
C:"<b>C</b>: no icon. Click a Project name to select it; click the <i>selected</i> Project's name again to open its files. Cleanest, least discoverable (today that second click collapses: collapse moves to the chevron only).",
D:"<b>D</b>: a \"Files\" line first under the Project, like a terminal line with a file icon. No new icon on the row; reads as a sibling of the terminals, but adds a line to every expanded Project."};
function render(){
 const side=drill!==null?`<div class="ph"><button class="project" data-a="back" title="Back to terminals">${ic.back}${ic.repo}<span class="project-name">${P[drill].n}</span><span class="hint">Terminals</span></button></div><div class="sidebar-scroll">${tree()}</div>`
  :`<div class="sidebar-scroll" style="padding-top:6px"><ul class="project-list">${P.map(row).join("")}</ul></div>`;
 document.getElementById("app").innerHTML=`<div class="window macos">
 <header class="header"><span style="width:70px"></span><div class="header-project"><span class="title project-label">${ic.repo}<strong>${P[sel].n}</strong></span></div><span style="flex:1"></span></header>
 <div class="body"><div class="sidebar-region" style="--sidebar-width:240px"><nav class="sidebar">${side}<button class="sidebar-footer">Settings</button></nav></div>
 <div class="centre-mock"><div class="half"><div>$ ${P[sel].t[selT]||"(no terminal)"}</div><div style="color:var(--faint)">Terminal of ${P[sel].n}</div></div><div class="half"><div>${drill!==null?(P[drill].f.find(f=>!f.endsWith("/")&&f.trim())||"—").trim():"(no file open)"}</div><div style="color:var(--faint)">Code workspace of ${P[sel].n}</div></div></div></div></div>
 <div class="note">${notes[k()]}<br><br><b>Header</b> (all variants): ← + Project name + "Terminals" hint; one click anywhere on it goes back. The selected Project does not change on the way back. In the file view the other Projects are not visible: to reach another Project's Terminal, go back first.</div>`;
 document.getElementById("bar").innerHTML=`<button id="pv">‹</button><span>${k()} (${V[vi][1]})</span><button id="nv">›</button>`;
 pv.onclick=()=>go(-1);nv.onclick=()=>go(1);
}
function go(d){vi=(vi+d+V.length)%V.length;drill=null;history.replaceState(null,"","?variant="+V[vi][0]);render()}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const a=b.dataset.a,i=+b.dataset.i;
 if(a=="back")drill=null;
 else if(a=="files"){sel=i;selT=0;drill=i}
 else if(a=="term"){sel=i;P[i].t.push("shell "+(P[i].t.length+1));selT=P[i].t.length-1}
 else if(a=="close"){alert("Close Project (stub)")}
 else if(a=="term-sel"){sel=i;selT=+b.dataset.j}
 else if(a=="name"){
  if(e.target.closest("[data-chev]"))closed=closed.includes(i)?closed.filter(x=>x!=i):[...closed,i];
  else if(k()=="C"&&sel==i)drill=i;
  else{sel=i;selT=0}}
 render()});
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key=="ArrowLeft")go(-1);if(e.key=="ArrowRight")go(1)});
render();
</script></body></html>
