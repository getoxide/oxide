<!doctype html>
<!-- PROTOTYPE, throwaway. Question (issue #525): how does the Files sidebar view show and switch its Project?
     Variants: A (tree silently follows), B1 (dropdown selector), B2 (header styled as a Terminals Project row).
     Reuses the real Oxide CSS. State is in memory only. Open this file directly; switch variants with the bottom bar, ←/→ or ?variant=B1 -->
<html><head><meta charset="utf-8"><title>PROTOTYPE files-project</title>
<link rel="stylesheet" href="../src/styles/fonts.css"><link rel="stylesheet" href="../src/styles/styles.css">
<style>
body{margin:0}
.sw{display:flex;gap:2px;padding:6px 8px 0}
.sw button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:5px;border:0;background:none;color:var(--faint);border-bottom:2px solid transparent;font-size:12.5px;cursor:pointer}
.sw button[aria-pressed=true]{color:var(--fg-bright);border-bottom-color:var(--acc)}
.tree{padding:6px 0;font-size:13px}
.tree div{padding:3px 12px;color:var(--dim);white-space:nowrap}.tree .d{color:var(--fg)}
.sel{margin:8px 8px 4px;position:relative}
.sel>button{width:100%;display:flex;align-items:center;gap:8px;justify-content:flex-start}
.pop{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--bg3);border:1px solid var(--line-strong);border-radius:6px;padding:4px;z-index:5;box-shadow:0 6px 20px #0008}
.pop button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;color:var(--dim);padding:5px 8px;border-radius:4px;cursor:pointer;font-size:13px}
.pop button:hover{background:var(--bg4);color:var(--fg)}.pop button[aria-current=true]{color:var(--fg-bright)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.ph{display:flex;align-items:center;padding:6px 8px 2px 0;border-bottom:1px solid var(--line);position:relative}
.ph .project{flex:1}
.ph .pop{left:8px;right:8px;top:calc(100% - 2px)}
.centre-mock{flex:1;display:flex;min-width:0}
.half{flex:1;padding:12px;font-family:var(--mono);font-size:12px;color:var(--dim);min-width:0}
.half+.half{border-left:1px solid var(--line);background:var(--bg)}
.bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:99px;padding:6px 10px;display:flex;gap:10px;align-items:center;font:600 13px Inter,sans-serif;box-shadow:0 4px 20px #000a;z-index:99}
.bar button{border:0;background:#ddd;border-radius:99px;width:26px;height:26px;cursor:pointer}
.note{position:fixed;top:48px;right:12px;max-width:300px;background:var(--bg3);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--dim);z-index:4}
.note b{color:var(--fg-bright)}
</style></head><body>
<div id="app"></div><div class="bar" id="bar"></div>
<script>
const P=[{n:"oxide",t:["claude","pnpm dev"],f:["crates/","  oxide-core/","  oxide-app/","web/","  src/","    App.tsx","GLOSSARY.md"]},
         {n:"compass-site",t:["shell"],f:["templates/","  _layout.twig","src/","  app.js","composer.json"]},
         {n:"notes",t:[],f:["inbox.md","ideas/","  fileview.md"]}];
const V=[["A","Tree silently follows"],["B1","Dropdown selector"],["B2","Header = Project row"]];
let sel=0,view="Files",pop=false;
let vi=Math.max(0,V.findIndex(v=>v[0]==new URLSearchParams(location.search).get("variant")));
const ic={repo:'<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/></svg>',
 chev:'<svg class="disclosure-chev" width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/></svg>',
 down:'<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M12.78 5.22a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L3.22 6.28a.75.75 0 0 1 1.06-1.06L8 8.94l3.72-3.72a.75.75 0 0 1 1.06 0Z"/></svg>',
 term:'<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25Z"/></svg>',
 file:'<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Z"/></svg>'};
const picker=()=>`<div class="pop" role="listbox">${P.map((p,i)=>`<button role="option" aria-current="${i==sel}" data-p="${i}">${ic.repo}${p.n}</button>`).join("")}<hr><button data-act="open">Open a Project…</button></div>`;
function filesHead(){
 const v=V[vi][0];
 if(v=="A")return"";
 if(v=="B1")return`<div class="sel"><button class="btn" data-act="pop" aria-haspopup="listbox" aria-expanded="${pop}">${ic.repo}<span style="flex:1;text-align:left">${P[sel].n}</span>${ic.down}</button>${pop?picker():""}</div>`;
 return`<div class="ph"><button class="project" aria-current="true" data-act="pop" aria-haspopup="listbox" aria-expanded="${pop}">${ic.chev}${ic.repo}<span class="project-name">${P[sel].n}</span></button>${pop?picker():""}</div>`;
}
const terms=()=>`<ul class="project-list">${P.map((p,i)=>`<li class="project-node"><div class="project-row"><button class="project" aria-current="${i==sel}" aria-expanded="true" data-p="${i}">${ic.chev}${ic.repo}<span class="project-name">${p.n}</span></button></div>${p.t.length?`<ul class="terminal-list">${p.t.map(t=>`<li class="terminal-row"><button class="terminal-item" aria-current="${i==sel&&t==p.t[0]}">${ic.term}<span class="terminal-item-title">${t}</span></button></li>`).join("")}</ul>`:`<ul><li class="sidebar-note">No terminals</li></ul>`}</li>`).join("")}</ul>`;
const tree=()=>`<div class="tree">${P[sel].f.map(l=>`<div class="${l.endsWith("/")?"d":""}" style="padding-left:${12+l.search(/\S/)*8}px">${l.trim()}</div>`).join("")}</div>`;
const notes={A:"<b>A</b>: nothing in the Files view says which Project it shows except the titlebar chip. To change it you must go back to Terminals and click another Project.",
B1:"<b>B1</b>: a new control that exists only in Files. Clear, but it is a different widget from the Project rows you know.",
B2:"<b>B2</b>: same row as in Terminals (chevron, icon, name). Click it: the list of Open Projects opens, pick one to switch. Familiar, but the chevron suggests 'collapse', not 'switch'."};
function render(){
 document.getElementById("app").innerHTML=`<div class="window macos">
 <header class="header"><span style="width:70px"></span><div class="header-project"><span class="title project-label">${ic.repo}<strong>${P[sel].n}</strong></span></div><span style="flex:1"></span></header>
 <div class="body"><div class="sidebar-region" style="--sidebar-width:240px"><nav class="sidebar">
  <div class="sw"><button aria-pressed="${view=="Terminals"}" data-v="Terminals">${ic.term} Terminals</button><button aria-pressed="${view=="Files"}" data-v="Files">${ic.file} Files</button></div>
  ${view=="Files"?`${filesHead()}<div class="sidebar-scroll">${tree()}</div>`:`<div class="sidebar-scroll" style="padding-top:6px">${terms()}</div>`}
  <button class="sidebar-footer">Settings</button></nav></div>
  <div class="centre-mock"><div class="half"><div>$ ${P[sel].t[0]||"(no terminal)"}</div><div style="color:var(--faint)">Terminal of ${P[sel].n}</div></div><div class="half"><div>${(P[sel].f.find(f=>!f.endsWith("/")&&f.trim())||"—").trim()}</div><div style="color:var(--faint)">Code workspace of ${P[sel].n}</div></div></div></div></div>
 <div class="note">${notes[V[vi][0]]}<br><br>Picking a Project here also selects it: its Terminal on the left, its Code on the right.</div>`;
 document.getElementById("bar").innerHTML=`<button id="pv">‹</button><span>${V[vi][0]} (${V[vi][1]})</span><button id="nv">›</button>`;
 pv.onclick=()=>go(-1);nv.onclick=()=>go(1);
}
function go(d){vi=(vi+d+V.length)%V.length;pop=false;history.replaceState(null,"","?variant="+V[vi][0]);render()}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-v],[data-p],[data-act]");
 if(!b){if(pop){pop=false;render()}return}
 if(b.dataset.v){view=b.dataset.v;pop=false}
 else if(b.dataset.act=="pop")pop=!pop;
 else if(b.dataset.act=="open"){alert("Open a Project palette (stub)");pop=false}
 else if(b.dataset.p!==undefined){sel=+b.dataset.p;pop=false}
 render()});
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key=="ArrowLeft")go(-1);if(e.key=="ArrowRight")go(1)});
render();
</script></body></html>
