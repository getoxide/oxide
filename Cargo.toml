[workspace]
resolver = "3"
members = ["crates/oxide-provider", "crates/oxide-core", "crates/oxide-app"]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
crossbeam-channel = "0.5.17"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
windows-sys = "0.61.2"

# Tauri integration tests link large binaries. Omit debug symbols to keep the
# persistent cache small, and reuse incremental work when workspace code changes.
# The test profile inherits these development settings; release is unaffected.
[profile.dev]
debug = 0
incremental = true

# Optimize cryptographic hashing even in development profile so verifying downloaded
# models or cold artifacts runs at near-release speed instead of 14 seconds unoptimized.
[profile.dev.package.sha2]
opt-level = 3
